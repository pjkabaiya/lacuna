<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quote moderation – No Nut November</title>
<link rel="icon" type="image/jpeg" href="icon.jpg">
<style>
:root{color-scheme:dark;--bg:#0e1116;--card:#171b23;--text:#f2f4f8;--muted:#8b93a3;--accent:#ff6b35;--line:#262c38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:clamp(26px,6vw,38px);margin:8px 0}
p{color:var(--muted)}
a{color:#ffb347}
form,.quote{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:200px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}
button{background:linear-gradient(90deg,var(--accent),#ffb347);color:#fff;border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.quote p{color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.quote small{color:var(--muted)}
.message{min-height:1.5em;color:var(--muted)}
.quote button{margin-top:12px}
</style>
</head>
<body>
<main>
  <a href="index.html">← Back to the site</a>
  <h1>Quote moderation</h1>
  <p>Enter the Render <code>ADMIN_KEY</code> to review pending quotes. It is kept only in this page while it is open.</p>
  <form id="key-form">
    <input id="admin-key" type="password" placeholder="Admin key" autocomplete="current-password" required>
    <button id="load-button" type="submit">Load pending quotes</button>
  </form>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <section id="quotes" aria-label="Pending quotes"></section>
</main>
<script src="config.js"></script>
<script>
const api=(window.API_BASE||"/api").replace(/\/+$/,"");
const keyInput=document.getElementById("admin-key");
const loadButton=document.getElementById("load-button");
const message=document.getElementById("message");
const quoteList=document.getElementById("quotes");
let adminKey="";

async function request(path,options={}){
  const response=await fetch(api+path,{
    ...options,
    headers:{"x-admin-key":adminKey,...options.headers}
  });
  let data={};
  try{data=await response.json()}catch(e){}
  if(!response.ok)throw new Error(response.status===401?"Admin key was not accepted.":data.error||"Request failed ("+response.status+").");
  return data;
}

function showQuotes(quotes){
  quoteList.replaceChildren();
  if(!quotes.length){
    message.textContent="No pending quotes.";
    return;
  }
  message.textContent=quotes.length+" pending quote"+(quotes.length===1?"":"s")+".";
  quotes.forEach(quote=>{
    const card=document.createElement("article");
    card.className="quote";
    const text=document.createElement("p");
    text.textContent="“"+quote.text+"”";
    const author=document.createElement("small");
    author.textContent="— "+quote.name;
    const approve=document.createElement("button");
    approve.type="button";
    approve.textContent="Approve";
    approve.addEventListener("click",async()=>{
      approve.disabled=true;
      message.textContent="Approving quote…";
      try{
        await request("/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:String(quote._id),action:"approve"})});
        card.remove();
        const remaining=quoteList.children.length;
        message.textContent=remaining?remaining+" quote"+(remaining===1?"":"s")+" remaining.":"All pending quotes have been reviewed.";
      }catch(error){
        message.textContent=error.message;
        approve.disabled=false;
      }
    });
    card.append(text,author,document.createElement("br"),approve);
    quoteList.append(card);
  });
}

async function loadQuotes(){
  loadButton.disabled=true;
  message.textContent="Loading pending quotes…";
  try{
    const data=await request("/admin?status=pending");
    showQuotes(data.quotes||[]);
  }catch(error){
    message.textContent=error.message;
    quoteList.replaceChildren();
  }finally{
    loadButton.disabled=false;
  }
}

document.getElementById("key-form").addEventListener("submit",event=>{
  event.preventDefault();
  adminKey=keyInput.value;
  loadQuotes();
});
</script>
</body>
</html>
