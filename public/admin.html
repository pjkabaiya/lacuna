<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbd9c9">
  <title>Learning stats — lacuna</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="css/lacuna.css">
  <script src="config.js"></script>
  <script defer src="js/admin.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="lacuna home">lacuna<span aria-hidden="true"></span></a>
    <a class="header-link" href="index.html">Back to learning</a>
  </header>
  <main class="admin-main">
    <p class="eyebrow">Learning insights</p>
    <h1>Step difficulty</h1>
    <p class="admin-intro">Anonymous totals help spot steps or distractors learners may be getting stuck on. No names, emails, or IP addresses are shown.</p>
    <form id="key-form" class="admin-form">
      <label for="admin-key">Admin key</label>
      <input id="admin-key" type="password" autocomplete="current-password" required>
      <button id="load-button" class="button button-primary" type="submit">Load stats</button>
    </form>
    <p id="message" class="admin-message" role="status" aria-live="polite"></p>
    <section id="stats" hidden aria-label="Learning statistics">
      <div id="summary" class="stats-summary"></div>
      <section class="admin-section">
        <h2>Lesson completion</h2>
        <div id="completion-list" class="admin-table-wrap"></div>
      </section>
      <section class="admin-section">
        <h2>Hardest steps</h2>
        <div id="hardest-list" class="admin-table-wrap"></div>
      </section>
      <section class="admin-section">
        <h2>Most-picked wrong options</h2>
        <div id="options-list" class="admin-table-wrap"></div>
      </section>
    </section>
  </main>
</body>
</html>
