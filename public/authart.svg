<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="A code line with a missing piece, three answer options, and a typing box" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#5A1A20"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="1500" fill="#3B0D11"/>
  <rect width="1200" height="1500" fill="url(#dots)"/>

  <!-- big gap motif: tomato disc with a saffron bite -->
  <circle cx="1010" cy="250" r="170" fill="#1F0508" transform="translate(14 14)"/>
  <circle cx="1010" cy="250" r="170" fill="#E5412D" stroke="#1F0508" stroke-width="6"/>
  <circle cx="1075" cy="195" r="78" fill="#3B0D11" stroke="#1F0508" stroke-width="6"/>
  <circle cx="1075" cy="195" r="78" fill="url(#dots)"/>
  <circle cx="1110" cy="1410" r="52" fill="#F6B91A" stroke="#1F0508" stroke-width="6"/>
  <rect x="930" y="1370" width="84" height="84" rx="20" fill="#6B7A2A" stroke="#1F0508" stroke-width="6" transform="rotate(14 972 1412)"/>

  <!-- wordmark -->
  <text x="90" y="215" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="104" fill="#E5412D" letter-spacing="-3">lacuna</text>
  <rect x="92" y="240" width="150" height="26" rx="6" fill="#1F0508" transform="translate(7 7)"/>
  <rect x="92" y="240" width="150" height="26" rx="6" fill="#F6B91A"/>

  <!-- code card -->
  <g transform="rotate(-2.5 600 640)">
    <rect x="130" y="400" width="960" height="470" rx="30" fill="#E5412D" transform="translate(18 18)"/>
    <rect x="130" y="400" width="960" height="470" rx="30" fill="#FFF0E8" stroke="#1F0508" stroke-width="7"/>
    <!-- window dots -->
    <circle cx="190" cy="456" r="13" fill="#E5412D" stroke="#1F0508" stroke-width="4"/>
    <circle cx="236" cy="456" r="13" fill="#F6B91A" stroke="#1F0508" stroke-width="4"/>
    <circle cx="282" cy="456" r="13" fill="#6B7A2A" stroke="#1F0508" stroke-width="4"/>
    <line x1="130" y1="495" x2="1090" y2="495" stroke="#1F0508" stroke-width="5"/>

    <g font-family="'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="52" font-weight="700">
      <!-- line numbers -->
      <text x="170" y="600" fill="#B08078" font-size="38">1</text>
      <text x="170" y="715" fill="#B08078" font-size="38">2</text>
      <!-- line 1: name = "Ada" -->
      <text x="240" y="600" fill="#3B0D11">name</text>
      <text x="390" y="600" fill="#E5412D">=</text>
      <text x="460" y="600" fill="#6B7A2A">"Ada"</text>
      <!-- line 2: print(<slot>) -->
      <text x="240" y="715" fill="#E5412D">print(</text>
      <rect x="420" y="660" width="190" height="78" rx="16" fill="#1F0508" transform="translate(7 7)"/>
      <rect x="420" y="660" width="190" height="78" rx="16" fill="#F6B91A" stroke="#1F0508" stroke-width="5"/>
      <text x="515" y="716" fill="#3B0D11" text-anchor="middle" font-size="46">?</text>
      <text x="628" y="715" fill="#E5412D">)</text>
    </g>

    <!-- output strip -->
    <rect x="130" y="780" width="960" height="90" rx="0" fill="#3B0D11"/>
    <path d="M130 870 H1090 V842 Q1090 870 1062 870 H158 Q130 870 130 842Z" fill="#3B0D11"/>
    <text x="175" y="840" font-family="'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="38" font-weight="700" fill="#F6B91A">▶  Ada</text>
  </g>

  <!-- answer chips -->
  <g font-family="'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="44" font-weight="700">
    <g transform="rotate(-3 300 1010)">
      <rect x="110" y="960" width="270" height="100" rx="22" fill="#F6B91A" transform="translate(9 9)"/>
      <rect x="110" y="960" width="270" height="100" rx="22" fill="#6B7A2A" stroke="#1F0508" stroke-width="6"/>
      <text x="215" y="1025" fill="#FFF0E8" text-anchor="middle">name</text>
      <circle cx="372" cy="962" r="30" fill="#FFF0E8" stroke="#1F0508" stroke-width="5"/>
      <path d="M357 962 l11 12 l20 -24" fill="none" stroke="#6B7A2A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="rotate(2 600 1010)">
      <rect x="440" y="965" width="300" height="100" rx="22" fill="#E5412D" transform="translate(9 9)"/>
      <rect x="440" y="965" width="300" height="100" rx="22" fill="#FFF0E8" stroke="#1F0508" stroke-width="6" opacity="0.92"/>
      <text x="590" y="1030" fill="#3B0D11" text-anchor="middle">"name"</text>
    </g>
    <g transform="rotate(-1.5 900 1010)">
      <rect x="790" y="960" width="300" height="100" rx="22" fill="#E5412D" transform="translate(9 9)"/>
      <rect x="790" y="960" width="300" height="100" rx="22" fill="#FFF0E8" stroke="#1F0508" stroke-width="6" opacity="0.92"/>
      <text x="940" y="1025" fill="#3B0D11" text-anchor="middle">(name)</text>
    </g>
  </g>

  <!-- curved arrow from chosen chip up to the slot -->
  <path d="M215 940 C 170 880, 250 820, 372 768" fill="none" stroke="#F6B91A" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 22"/>
  <polygon points="406,754 378,788 362,750" fill="#F6B91A" stroke="#F6B91A" stroke-width="6" stroke-linejoin="round"/>

  <!-- type-it box -->
  <text x="110" y="1170" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="30" fill="#F6B91A" letter-spacing="4">NOW TYPE IT</text>
  <rect x="110" y="1195" width="980" height="110" rx="24" fill="#1F0508" transform="translate(9 9)"/>
  <rect x="110" y="1195" width="980" height="110" rx="24" fill="#FFF0E8" stroke="#F6B91A" stroke-width="7"/>
  <text x="160" y="1266" font-family="'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="52" font-weight="700" fill="#3B0D11">name</text>
  <rect x="296" y="1219" width="8" height="62" fill="#E5412D"/>

  <!-- tagline -->
  <text x="110" y="1415" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-weight="800" font-size="62" fill="#FBD9C9" letter-spacing="-1.5">Every gap is a lesson.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
