services:
  - type: web
    name: no-nut-november-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run validate:lessons
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: lacuna
      - key: IP_SALT
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
